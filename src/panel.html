<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabBubbles</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="glass">
    <div class="brand">🫧 TabBubbles</div>
    <div id="summary" class="summary"></div>
  </header>

  <section id="tasks" class="tasks glass" hidden>
    <h2>Unfinished</h2>
    <ul id="taskList"></ul>
  </section>

  <nav class="bar glass">
    <label>Group by
      <select id="groupBy">
        <option value="window">Window</option>
        <option value="domain">Site</option>
        <option value="none">Nothing</option>
      </select>
    </label>
    <label><input type="checkbox" id="idleOnly"> Idle only</label>
    <button id="popIdle" class="danger" title="Close every idle tab that isn't pinned, playing sound or an unfinished task">Pop idle</button>
  </nav>
  <div id="legend" class="legend" aria-label="Bubble colours: how long since you looked at the tab"></div>

  <main id="groups"></main>

  <div id="markBox" class="mark glass" hidden>
    <div class="markTitle" id="markTitle"></div>
    <input id="markNote" maxlength="140" placeholder="What's left to do here? (optional)">
    <div class="row"><button id="markSave" class="primary">Mark as task</button><button id="markCancel">Cancel</button></div>
  </div>

  <details class="settings glass">
    <summary>Settings</summary>
    <label>Tab counts as idle after <input type="number" id="idleMinutes" min="1" max="10080"> min</label>
    <label>Remind about an unfinished task after <input type="number" id="taskRemindMinutes" min="1" max="1440"> min</label>
    <label><input type="checkbox" id="notify"> Show a notification (the badge is always on)</label>
    <p class="privacy">Everything stays in this browser. TabBubbles sends nothing anywhere.</p>
  </details>

  <script src="shared.js"></script>
  <script src="panel.js"></script>
</body>
</html>
